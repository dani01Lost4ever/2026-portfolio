server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the PocketBase host per request (via the
    # variable below) lets nginx start even if PocketBase isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pocketbase http://pocketbase:8090;

    # Behind Coolify's proxy: take the visitor's IP from X-Forwarded-For, but
    # only when the request comes from a private (internal) address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # PocketBase API and admin UI, proxied on the same domain as the site
    location /api/ {
        proxy_pass $pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 20m;

        # Realtime uses server-sent events: no buffering, long-lived reads
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location /_/ {
        proxy_pass $pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
    }

    # Runtime config and the HTML shell must never be cached
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA — all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
