# Coolify stack: site + PocketBase on one domain.
#
# In Coolify, create a "Docker Compose" resource from this repository with
# Base Directory `/coolify` (Coolify then finds this file at its default
# location, /docker-compose.yaml). Build contexts are relative to this folder.
#
# Leave `pocketbase` without a domain: nginx in `frontend` proxies /api/ and
# /_/ (admin UI) to it over the stack's internal network.
#
# The Coolify server runs without its own proxy (Proxy: None); Nginx Proxy
# Manager terminates TLS and forwards the domain to the host port below.

services:
  pocketbase:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PB_VERSION: "0.36.7"
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      # Host port Nginx Proxy Manager forwards to
      - "${FRONTEND_PORT:-8810}:80"
    environment:
      # Empty = same origin through the nginx proxy. Set a full URL only if
      # PocketBase is served from a separate domain.
      PB_URL: ${PB_URL:-}
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pb_data:
