<style>
:root{
  --paper:#F2EEE6;--ink:#0B0B0C;--ink-2:#44413B;--muted:#8C8679;--rule:rgba(11,11,12,.14);--hot:#FF5A3C;
  --wm:"Archivo","Arial Black",sans-serif;--ui:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--hud:"Chivo Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
#scroller{width:1px}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
.layer{position:absolute;inset:0;pointer-events:none}
.abs{position:absolute;left:0;top:0;transform-origin:0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* text that rises out of a mask line */
.m{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;line-height:1.16;padding:0 .05em .08em}
.m>span{display:block}
.mf{overflow:hidden}.mf>span{display:block}

/* wordmark */
#wm{position:absolute;inset:0}
.wl{position:absolute;left:0;top:0;transform-origin:0 0;font-family:var(--wm);font-weight:800;line-height:1;white-space:nowrap;color:var(--ink)}

/* tiles */
.tile{background:var(--ink);overflow:hidden;color:#fff}
.tile .poster,.tile .iris{position:absolute;left:0;top:0;width:100%;height:100%}
.tile .cap{position:absolute;left:0;bottom:0;right:0}
.tile .cap .m{position:relative;display:block}
.cap .n{font:500 var(--capn,11px)/1.1 var(--mono);letter-spacing:.04em;opacity:.8}
.cap .t{font:600 var(--capt,18px)/1.1 var(--ui);letter-spacing:-.01em}
.cap .s{font:400 var(--caps,13px)/1.25 var(--ui);opacity:.82}
.pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-weight:500;letter-spacing:-.01em}

/* liquid glass */
.glass .gs{position:absolute;left:0;top:0;overflow:visible}
.glass .gc{position:absolute;inset:0;overflow:hidden;border-radius:inherit;color:#fff}
.glass.rr{box-shadow:0 12px 34px rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.14)}
.goo .glass{box-shadow:none!important;filter:none!important}
.a{position:absolute;left:0;top:0;transform-origin:0 0}
.iris{position:absolute;left:0;top:0;width:100%;height:100%}
.ico{width:100%;height:100%;display:block;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* case study text */
.cw{color:#fff}
.k-mono{font-family:var(--mono);font-weight:500;letter-spacing:.03em}

/* lock screen / phone */
#lock{overflow:hidden;background:#1a1a40}
#lock .wp{position:absolute;left:0;top:0;width:100%;height:100%}
#bezel{background:#0B0B0C;box-shadow:0 0 0 1.5px #2c2c2e,0 40px 90px rgba(20,16,10,.28)}
.sbtn{position:absolute;background:#1c1c1e;border-radius:2px}
.card-t{position:absolute;left:0;top:0;white-space:nowrap}

/* mac window */
#win{background:#FBFAF7;overflow:hidden;box-shadow:0 50px 100px rgba(30,24,14,.22),0 0 0 1px rgba(11,11,12,.08)}
#blind{background:#0B0B0C;overflow:hidden}
#roller{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#3a3a3c,#111)}
.tl-dot{position:absolute;border-radius:50%}
.tab{position:absolute;color:#F2EEE6;font:500 var(--tabf,12px)/1 var(--ui)}
.bar{position:absolute;left:0;top:0;transform-origin:0 50%}
.sw{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:50%}
#seg,#segW{position:absolute;border-radius:999px}
#seg{box-shadow:inset 0 0 0 1px var(--ink)}
.segt{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font:500 var(--segf,13px)/1 var(--ui)}

/* framed print */
#frame .mold,#frame .mat,#frame .img,#frame .paint{position:absolute;left:0;top:0}
#frame .img{overflow:hidden}
#frame .img svg{width:100%;height:100%;display:block}

/* order shape */
#cta{background:var(--ink);color:#F2EEE6;overflow:hidden}
#cta .pl{font-weight:600}

/* wall */
#wall{background:radial-gradient(ellipse at 28% 18%,#F3ECE0 0%,#E6DCCD 52%,#D6C9B6 100%)}
#wlight{position:absolute;left:-10%;top:-20%;width:70%;height:120%;background:linear-gradient(100deg,rgba(255,250,240,.0),rgba(255,250,240,.55) 40%,rgba(255,250,240,0) 75%);transform:skewX(-18deg);filter:blur(40px)}
#wmat{background:#FBF9F4;box-shadow:inset 0 2px 8px rgba(0,0,0,.18)}
#wprint{overflow:hidden}
#wprint svg{width:100%;height:100%;display:block}
#wmold{box-shadow:0 0 0 0 var(--ink)}
#leaves{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply}
#placard{background:#FBF9F5;color:var(--ink);box-shadow:0 2px 6px rgba(40,30,15,.14),0 12px 30px rgba(40,30,15,.08);pointer-events:auto}
#placard a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
#placard a:hover{border-color:var(--ink)}

/* every project, on demand: a sheet that grows out of its tile */
.tile.clickable{pointer-events:auto;cursor:pointer}
.tile.clickable:hover{box-shadow:0 0 0 3px var(--ink)}
.allbtn{all:unset;cursor:pointer;pointer-events:auto;font:500 var(--capn,11px)/1.2 var(--mono);letter-spacing:.04em;border-bottom:1px solid currentColor}
.allbtn:focus-visible,.vbtn:focus-visible,.vnav:focus-visible,.vclose:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
#viewL{display:none}
.vscrim{position:absolute;inset:0;background:#0B0B0C;opacity:0;pointer-events:auto}
#sheet{background:#FBFAF7;overflow:hidden;box-shadow:0 40px 120px rgba(20,14,6,.35);pointer-events:auto;color:var(--ink)}
.vcol{position:absolute;left:0;top:0;overflow:hidden}
.vposter{position:absolute;left:0;top:0;overflow:hidden;background:var(--ink)}
.vposter svg{width:100%;height:100%;display:block}
.vbody{position:absolute;top:0;overflow-y:auto;overscroll-behavior:contain;padding:44px 48px 110px}
.vl{overflow:hidden}.vl>div{padding-bottom:2px}
.vk{font:500 11px/1.4 var(--hud);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vt{font-family:var(--wm);font-weight:800;font-stretch:125%;font-size:clamp(28px,3.6vw,52px);line-height:1.02;letter-spacing:-.01em;margin-top:14px}
.vs{font:500 18px/1.35 var(--ui);margin-top:10px}
.vd{font:400 15.5px/1.6 var(--ui);color:var(--ink-2);margin-top:18px;max-width:58ch}
.vres{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
.vres b{display:block;font-family:var(--wm);font-weight:800;font-stretch:125%;font-size:28px;line-height:1.05}
.vres span{font:500 12px/1.3 var(--ui);color:var(--muted)}
.vtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:24px}
.vtags span{font:500 11px/1 var(--mono);padding:7px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule)}
.vacts{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.vbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;font:600 13px/1 var(--ui);background:var(--ink);color:#F2EEE6}
.vbtn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vclose{all:unset;cursor:pointer;position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:#FBFAF7;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.vclose svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2;fill:none}
.vnavbar{position:absolute;bottom:0;display:flex;justify-content:space-between;gap:10px;padding:18px 24px;background:linear-gradient(rgba(251,250,247,0),#FBFAF7 45%)}
.vnav{all:unset;cursor:pointer;font:500 11px/1.2 var(--hud);letter-spacing:.05em;text-transform:uppercase;padding:11px 14px;border-radius:999px;background:#FBFAF7;box-shadow:inset 0 0 0 1px var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.vnav:hover{box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:760px){.vbody{padding:26px 20px 100px}.vs{font-size:16px}.vd{font-size:14.5px}}

/* cursor */
#cursor{width:26px;height:26px;transform-origin:5px 3px}
#ring{border-radius:50%;border:2px solid var(--ink)}

/* chrome */
#chrome{position:absolute;inset:0;pointer-events:none;color:var(--ink);font-family:var(--hud)}
#chrome.dark{color:#F2EEE6}
#chrome.dark #ring{border-color:#F2EEE6}
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(16px,3vw,40px)}
.brand{font:500 11.5px/1.25 var(--hud);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.brand b{font-weight:600}
.brand span{opacity:.55}
#chap{display:flex;gap:2px;pointer-events:auto}
#chap button{all:unset;cursor:pointer;padding:7px 11px;border-radius:999px;font:500 11px/1 var(--hud);letter-spacing:.06em;text-transform:uppercase;opacity:.5}
#chap button:hover{opacity:.85}
#chap button.on{opacity:1;box-shadow:inset 0 0 0 1px currentColor}
#chap button:focus-visible,#play:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
#play{all:unset;cursor:pointer;pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;box-shadow:inset 0 0 0 1px currentColor;font:500 11px/1 var(--hud);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
#play svg{width:10px;height:10px;fill:currentColor}
#bot{position:absolute;left:0;right:0;bottom:0;padding:0 clamp(16px,3vw,40px) 14px}
#tl{position:relative;height:16px;pointer-events:auto;cursor:pointer}
.tick{position:absolute;bottom:0;width:1px;height:5px;background:currentColor;opacity:.3}
.tick.ch{height:11px;opacity:.85}
#ph{position:absolute;bottom:0;left:0;width:2px;height:16px;background:var(--hot)}
#meta{display:flex;justify-content:space-between;gap:12px;font:400 10.5px/1 var(--hud);letter-spacing:.05em;text-transform:uppercase;margin-top:9px;opacity:.7;white-space:nowrap}
@media (max-width:820px){#chap{display:none}.brand span{display:none}#meta .hint{display:none}}
</style>

const $ = (s, r = document) => r.querySelector(s);

const SPB = 0.5; // seconds per beat

// Closed-form spring step response (0 before tau=0, settles at 1): the textbook
// damped harmonic oscillator, with resp = undamped period in seconds and damp = damping ratio.
function stepResp(tau, resp, damp) {

const SP = {

function leavesSVG() {
  // two branches reaching in from the top right; their shadows sway like footage
  const branch = (x0, y0, len, ang, n, side) => {
    let d = '', lv = '';
    const pts = [];
    for (let i = 0; i <= n; i++) { const p = i / n, a = ang + Math.sin(p * 2.2) * .35 * side; pts.push([x0 + Math.cos(a) * len * p, y0 + Math.sin(a) * len * p]); }
    d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join('L');
    pts.forEach(([x, y], i) => {
      if (i === 0) return;
      const a = (ang * 180 / Math.PI) + (i % 2 ? 48 : -48) + i * 3 * side, s = 1 - i / (n * 1.6);
      lv += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(46 * s).toFixed(1)}" ry="${(15 * s).toFixed(1)}" transform="rotate(${a.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}) translate(${(34 * s).toFixed(1)} 0)"/>`;
    });
    return `<g class="br" data-x="${x0}" data-y="${y0}"><path d="${d}" fill="none" stroke="#3f3122" stroke-width="5"/>${lv}</g>`;
  };
  return `<svg id="leaves" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
    <defs><filter id="lb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter></defs>
    <g filter="url(#lb)" fill="#3f3122" fill-opacity=".3" stroke-opacity=".3">
      ${branch(1060, -40, 620, 2.25, 11, 1)}${branch(1060, 180, 520, 2.72, 9, -1)}${branch(880, -60, 380, 1.95, 7, 1)}
    </g></svg>`;
}

    let x = track(t, cx + .28 * vw, [[25.0, L.adjX, SP.move], [25.85, L.trackL, SP.move]]), y = track(t, vh - 30 * u, [[25.0, L.tbY, SP.move]]);
    const b = smooth(seg(t, 26.2, 26.6)); x = lerp(x, knobX(t), b); y = lerp(y, L.tbY, b);
    return { x: x + 4 * u, y: y + 6 * u, s: spr(t, 24.9, SP.pop) * (1 - spr(t, 30.85)), p: press(t, 25.5) + (spr(t, 26.45, SP.fast) - spr(t, 30.5)), clk: [25.5] };
  }
  if (t >= 45.5 && t < 48.95) {
    const P = L.phone;
    const x = track(t, vw * .55, [[45.6, P.x + P.w * .5, SP.move], [46.8, L.tabAbout.x, { r: .7, d: 1 }], [48.05, W.x + W.w * .5, SP.move]]);
    const y = track(t, vh * .92, [[45.6, P.y + P.h * .64, SP.move], [46.8, L.tabAbout.y, { r: .7, d: 1 }], [48.05, W.y + L.pageTop + L.heroH * .5, SP.move]]);
    return { x, y, s: spr(t, 45.5, SP.pop) * (1 - spr(t, 48.7)), p: spr(t, 46.0, SP.fast) - spr(t, 48.5), lp: t < 46.9 ? seg(t, 46.0, 46.75) * (1 - spr(t, 46.75)) : 0 };
  }
  if (t >= 51.8 && t < 55.45) {
    const pX = W.x + L.prX, swy = W.y + L.swY + L.swD / 2;
    const x = track(t, W.x + W.w * .92, [[51.9, pX + L.swD / 2 + L.swD + 14 * L.wu, SP.move], [53.0, pX + L.segW * .75, SP.move], [54.3, L.ctaSlot.cx + 30 * u, SP.move]]);
    const y = track(t, W.y + W.h * .96, [[51.9, swy, SP.move], [53.0, W.y + L.segY + L.segH / 2, SP.move], [54.3, L.ctaSlot.cy + 6 * u, SP.move]]);
    return { x, y, s: spr(t, 51.8, SP.pop) * (1 - spr(t, 55.3)), p: press(t, 52.75) + press(t, 53.5) + press(t, 55.0), clk: [52.75, 53.5, 55.0] };
  }
  return null;
}
function sceneCursor(t) {
  const c = cursorAt(t);
  const on = c && c.s > .01; show(E.cursor, on); show(E.ring, false); show(E.lp, false);
  if (!on) return;
  const k = (c.k || 1) * L.cur, s = c.s * k * (1 - .16 * c.p);
  E.cursor.style.transform = `translate(${c.x - 5}px,${c.y - 3}px) scale(${s})`;
  for (const tc of c.clk || []) {
    if (t >= tc && t < tc + .7) {
      const q = seg(t, tc, tc + .7), rr = (8 + 30 * eio(q)) * k;
      show(E.ring, true); boxC(E.ring, c.x, c.y, rr * 2, rr * 2); E.ring.style.borderWidth = Math.max(0, 2.5 * (1 - q)) * k + 'px';
    }
  }
  if (c.lp > .001) { const d = 46 * k; show(E.lp, true); boxC(E.lp, c.x, c.y, d, d); E.lpC.style.strokeDashoffset = 1 - c.lp; }
}

/* ---------------- chrome ---------------- */
const DARK = [[18.7, 38.35], [60.95, 62.45], [68.45, 68.8]];
function sceneChrome(t) {
  E.chrome.classList.toggle('dark', DARK.some(([a, b]) => t >= a && t < b));
  E.ph.style.left = `calc(${(t / T_END * 100).toFixed(3)}% - 1px)`;
  const secs = t * SPB;
  E.tc.textContent = `beat ${t.toFixed(1).padStart(4, '0')} / ${T_END} · ${String(Math.floor(secs / 60)).padStart(2, '0')}:${(secs % 60).toFixed(1).padStart(4, '0')}`;
  let on = 0; CHAPTERS.forEach((c, i) => { if (t >= c[1] - .5) on = i; });
  E.chap.forEach((b, i) => b.classList.toggle('on', i === on));
}

function seek(t) {
  sceneWipe(t); sceneWorld(t); sceneCase(t); sceneLock(t); sceneStage(t); sceneFrame(t); sceneCta(t); sceneWall(t); sceneCursor(t); sceneChrome(t);
}

/* ================================================================ viewer
   The optional path through the work: any tile opens a sheet that grows out
   of it, arrows push through all ten projects, closing folds it back into the
   tile. It runs on real time (springs since the click), not on the film clock. */
const V = { open: false, closing: false, i: 0, cur: 0, at: 0, closeAt: 0, navAt: -1e9, dir: 1, from: null, focus: null };
const rt = (now, t0, r, d) => stepResp((now - t0) / 1000, r, d);
function buildViewer() {
  const l = V.l = $('#viewL');
  V.scrim = mk('div', 'vscrim', l); V.scrim.addEventListener('click', vClose);
  V.sheet = mk('div', 'abs', l); V.sheet.id = 'sheet';
  // two panes per column, each column clipped, so a push never crosses into the other column
  V.pcol = mk('div', 'vcol', V.sheet); V.bcol = mk('div', 'vcol', V.sheet);
  V.posters = [mk('div', 'vposter', V.pcol), mk('div', 'vposter', V.pcol)];
  V.bodies = [mk('div', 'vbody', V.bcol), mk('div', 'vbody', V.bcol)];
  V.navbar = mk('div', 'vnavbar', V.sheet);
  V.prev = mk('button', 'vnav', V.navbar); V.next = mk('button', 'vnav', V.navbar);
  V.prev.type = V.next.type = 'button';
  V.prev.addEventListener('click', () => vNav(-1)); V.next.addEventListener('click', () => vNav(1));
  V.x = mk('button', 'vclose', V.sheet, '<svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg>');
  V.x.type = 'button'; V.x.setAttribute('aria-label', 'Close');
  V.x.addEventListener('click', vClose);
}
function vFill(k, i) {
  const w = WORKS[i], site = /github\.com/.test(w.link) ? 'Open on GitHub ↗' : 'Visit the site ↗';
  V.posters[k].innerHTML = `<svg><use href="#${w.sym}" width="100%" height="100%"/></svg>`;
  V.bodies[k].innerHTML = [
    `<div class="vk">${w.n} / 10 · ${w.y} · ${w.role}</div>`, `<h2 class="vt">${w.t}</h2>`, `<p class="vs">${w.s}</p>`, `<p class="vd">${w.d}</p>`,
    `<div class="vres">${w.res.map(r => `<div><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div>`,
    `<div class="vtags">${w.tags.map(x => `<span>${x}</span>`).join('')}</div>`,
    `<div class="vacts"><a class="vbtn" href="${w.link}" target="_blank" rel="noopener">${site}</a>${i === 0 ? '<button type="button" class="vbtn o vcase">Watch the case study ↓</button>' : ''}</div>`,
  ].map(h => `<div class="vl"><div>${h}</div></div>`).join('');
  const c = V.bodies[k].querySelector('.vcase');
  if (c) c.addEventListener('click', () => { vClose(); V.after = () => snapTo(22.5); });
  V.bodies[k].scrollTop = 0;
  const pv = WORKS[(i + 9) % 10], nx = WORKS[(i + 1) % 10];
  V.prev.textContent = `← ${pv.n} ${pv.t}`; V.next.textContent = `${nx.n} ${nx.t} →`;
}
function sheetRect() {
  if (vw < 760) return { x: 10, y: 58, w: vw - 20, h: vh - 68 };
  const w = Math.min(vw - 96, 1180), h = Math.min(vh - 150, 720);
  return { x: (vw - w) / 2, y: (vh - h) / 2 + 12, w, h };
}
function vOpen(i, r, rad) {
  stopAuto(); V.open = true; V.closing = false; V.i = i; V.cur = 0; V.navAt = -1e9; V.at = performance.now(); V.after = null;
  V.from = { x: r.left, y: r.top, w: r.width, h: r.height, r: Math.min(rad, r.height / 2) };
  V.focus = document.activeElement;
  vFill(0, i); show(V.posters[0], true); show(V.bodies[0], true); show(V.posters[1], false); show(V.bodies[1], false);
  V.l.style.display = 'block'; document.documentElement.style.overflow = 'hidden';
  V.x.focus({ preventScroll: true });
}
function vNav(d) {
  if (!V.open || V.closing) return;
  V.i = (V.i + d + 10) % 10; V.dir = d; V.cur = 1 - V.cur; V.navAt = performance.now();
  vFill(V.cur, V.i); show(V.posters[V.cur], true); show(V.bodies[V.cur], true);
}
function vClose() {
  if (!V.open || V.closing) return;
  V.closing = true; V.closeAt = performance.now();
  // fold back into the tile of the project on screen, or into the button for the tenth
  const t = V.i < 9 ? E.tiles[V.i].el : E.allBtn, r = t.getBoundingClientRect();
  V.from = { x: r.left, y: r.top, w: r.width, h: r.height, r: V.i < 9 ? L.rT : r.height / 2 };
}
function vRender(now) {
  if (!V.open) return;
  const S = sheetRect(), F = V.from, mob = vw < 760;
  let p;
  if (V.closing) {
    p = 1 - rt(now, V.closeAt, .42, 1);
    if (p < .003) {
      V.open = V.closing = false; V.l.style.display = 'none'; document.documentElement.style.overflow = '';
      goal = tT; writeScroll();
      if (V.focus && V.focus.isConnected) V.focus.focus({ preventScroll: true });
      if (V.after) { V.after(); V.after = null; }
      return;
    }
  } else p = rt(now, V.at, .52, .84);
  const pc = clamp(p), R = lerpR(F, S, p);
  boxTL(V.sheet, R.x, R.y, R.w, R.h); V.sheet.style.borderRadius = lerp(F.r, 26, pc) + 'px';
  V.scrim.style.opacity = (.32 * pc).toFixed(3);
  // the poster keeps filling the sheet at first, then gives way to the text
  const pw = mob ? R.w : lerp(R.w, S.w * .44, pc), ph = mob ? lerp(R.h, S.h * .34, pc) : R.h;
  const bx = mob ? 0 : R.w - S.w * .56, by = mob ? ph : 0, bw = mob ? R.w : S.w * .56, bh = mob ? R.h - ph : R.h;
  const q = rt(now, V.navAt, .5, .96), c = V.cur, o = 1 - c, dx = V.dir, nav = q < .999;
  show(V.posters[o], nav); show(V.bodies[o], nav);
  boxTL(V.pcol, 0, 0, pw, ph); boxTL(V.bcol, bx, by, bw, bh);
  boxTL(V.posters[c], 0, 0, pw, ph); V.posters[c].style.transform += ` translateX(${dx * (1 - q) * 100}%)`;
  boxTL(V.bodies[c], 0, 0, bw, bh); V.bodies[c].style.transform += ` translateX(${dx * (1 - q) * 100}%)`;
  if (nav) {
    boxTL(V.posters[o], 0, 0, pw, ph); V.posters[o].style.transform += ` translateX(${-dx * q * 100}%)`;
    boxTL(V.bodies[o], 0, 0, bw, bh); V.bodies[o].style.transform += ` translateX(${-dx * q * 100}%)`;
  }
  V.navbar.style.left = (mob ? 0 : bx) + 'px'; V.navbar.style.width = bw + 'px';
  V.navbar.style.transform = `translateY(${((1 - rt(now, V.at + 260, .45, .9)) * 110).toFixed(2)}%)`;
  // the copy rises out of its lines once the sheet has mostly opened
  const bl = V.bodies[c].children;
  for (let j = 0; j < bl.length; j++) {
    const r2 = V.navAt > V.at ? 1 : rt(now, V.at + 230 + j * 45, .45, .88);
    bl[j].firstChild.style.transform = `translateY(${((1 - r2) * 110).toFixed(2)}%)`;
  }
}

/* ================================================================ input + loop
   Wheel input moves a goal and the film glides to it. When input stops between
   two rest points, the film plays on to the end of that piece at film speed, or
   rewinds to its start if it had barely begun, so no scene is left half made. */
const RESTS = [0, 5.7, 13.0, 16.2, 22.5, 30.3, 37.5, 45.4, 50.3, 53.95, 60.4, 65.5, T_END];
const SNAP_FWD = .35, SNAP_RATE = 2.2, REWIND_RATE = 3.4, WHEEL_TAU = .2;
let tT = 0, goal = 0, playing = false, tween = null, snap = null, src = 'virtual', hold = false;
let last = performance.now(), lastInput = 0, lastDir = 1, touching = false, ownY = -1;
const playBtn = $('#play');
function setPlaying(v) {
  playing = v; tween = null; snap = null;
  playBtn.setAttribute('aria-pressed', v); playBtn.querySelector('span').textContent = v ? 'Pause' : 'Play the take';
  playBtn.querySelector('path').setAttribute('d', v ? 'M1 .5h3v9H1zM6 .5h3v9H6z' : 'M1 0.5v9l8-4.5z');
}
function stopAuto() { if (playing) setPlaying(false); tween = null; snap = null; hold = false; }
function goTo(b) { stopAuto(); tween = { from: tT, to: b, t0: performance.now(), dur: 900 + Math.abs(b - tT) * 12 }; }
function snapTo(b) { stopAuto(); snap = { to: b }; src = 'virtual'; }
function restFrom(t, dir) {
  if (dir > 0) return RESTS.find(r => r > t + .02) ?? T_END;
  for (let i = RESTS.length - 1; i >= 0; i--) if (RESTS[i] < t - .02) return RESTS[i];
  return 0;
}
function snapTarget(t, dir) {
  for (let i = 0; i < RESTS.length - 1; i++) {
    const a = RESTS[i], b = RESTS[i + 1];
    if (t < a - .001 || t > b + .001) continue;
    if (t - a < .02 || b - t < .02) return null;
    const p = (t - a) / (b - a);
    return dir >= 0 ? (p >= SNAP_FWD ? b : a) : (p <= 1 - SNAP_FWD ? a : b);
  }
  return null;
}
function writeScroll() { const y = Math.round(tT * BEAT_PX); if (Math.abs(scrollY - y) > 1) { ownY = y; scrollTo(0, y); } }
addEventListener('wheel', e => {
  if (V.open) { if (!V.sheet.contains(e.target)) e.preventDefault(); return; }
  e.preventDefault(); stopAuto();
  const d = clamp(e.deltaY * (e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? vh : 1), -400, 400);
  goal = clamp(goal + d / BEAT_PX, 0, T_END + 1.4);
  if (d) lastDir = Math.sign(d);
  lastInput = performance.now(); src = 'virtual';
}, { passive: false });
addEventListener('scroll', () => {
  if (V.open || Math.abs(scrollY - ownY) < 2) return;
  stopAuto();
  const g = scrollY / BEAT_PX; if (g !== goal) lastDir = Math.sign(g - goal) || lastDir;
  goal = g; lastInput = performance.now(); src = 'native';
}, { passive: true });
addEventListener('touchstart', () => { if (!V.open) { touching = true; stopAuto(); } }, { passive: true });
addEventListener('touchend', () => { touching = false; lastInput = performance.now(); }, { passive: true });
addEventListener('keydown', e => {
  if (V.open) {
    if (e.key === 'Escape') vClose(); else if (e.key === 'ArrowRight') vNav(1); else if (e.key === 'ArrowLeft') vNav(-1);
    return;
  }
  const base = snap ? snap.to : tT;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (['ArrowDown', 'PageDown', 'ArrowRight'].includes(e.code)) { e.preventDefault(); snapTo(restFrom(base, 1)); }
  else if (['ArrowUp', 'PageUp', 'ArrowLeft'].includes(e.code)) { e.preventDefault(); snapTo(restFrom(base, -1)); }
  else if (e.code === 'Home') { e.preventDefault(); goTo(0); }
});
playBtn.addEventListener('click', () => { hold = false; setPlaying(!playing); });
$('#tl').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); goTo(clamp((e.clientX - r.left) / r.width) * T_END); });
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!V.open) {
    if (tween) {
      const q = clamp((now - tween.t0) / tween.dur); tT = goal = lerp(tween.from, tween.to, eio(q));
      if (q >= 1) { tween = null; src = 'virtual'; }
    } else if (playing) tT = goal = tT + dt / SPB;
    else if (snap) {
      const rem = snap.to - tT, dir = Math.sign(rem), v = (dir > 0 ? SNAP_RATE : REWIND_RATE) * Math.min(1, .3 + Math.abs(rem) / .5);
      if (Math.abs(rem) <= v * dt) { tT = goal = snap.to; snap = null; } else tT = goal = tT + dir * v * dt;
    } else {
      tT += (goal - tT) * (1 - Math.exp(-dt / (src === 'native' ? .06 : WHEEL_TAU)));
      if (Math.abs(goal - tT) < 1e-4) tT = goal;
      if (!hold && !touching && now - lastInput > (src === 'native' ? 240 : 170) && Math.abs(goal - tT) < .03) {
        const to = snapTarget(tT, lastDir); if (to != null) snap = { to };
      }
    }
    // last frame = first frame, so the take loops without a seam
    if (tT >= T_END) { tT -= T_END; goal -= T_END; if (snap) { snap.to -= T_END; if (snap.to <= tT + 1e-6) snap = null; } }
    if (src === 'virtual' || playing || tween || snap) writeScroll();
  }
  const ambient = tT >= 61.2 && tT < 68.6;
  if (tT !== lastT || ambient || (tT >= 32.4 && tT < 61.3 && Math.floor(now / 1000) !== Math.floor((now - dt * 1000) / 1000))) { seek(tT); lastT = tT; }
  vRender(now);
  requestAnimationFrame(frame);
}

// for reviewing single frames: oneTake.seek(beat) holds that frame until the next input
window.oneTake = {
  seek(b) { stopAuto(); hold = true; tT = goal = b; writeScroll(); seek(b); lastT = b; },
  get beat() { return tT; }, get snapping() { return snap ? snap.to : null; }, rests: RESTS,
  open: i => vOpen(i, (i < 9 ? E.tiles[i].el : E.allBtn).getBoundingClientRect(), i < 9 ? L.rT : 999), close: () => vClose(),
};

let rz = 0;
// (a resize can land before the fonts have loaded and build() has run: nothing to lay out yet)
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!E.letters) return; layout(); goal = tT; writeScroll(); seek(tT); }, 120); });
Promise.all([
  document.fonts.load('800 100px Archivo'), document.fonts.load('expanded 800 100px Archivo'),
  document.fonts.load('500 20px Geist'), document.fonts.load('600 20px Geist'), document.fonts.load('500 20px "Geist Mono"'), document.fonts.load('500 12px "Chivo Mono"'),
]).catch(() => {}).then(() => document.fonts.ready).then(() => {
  build(); buildViewer(); layout();
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  scrollTo(0, 0); tT = goal = 0; seek(0);
  requestAnimationFrame(frame);
});
})();
</script>
</body>
